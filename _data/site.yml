# Site-wide settings. Edit freely.
name: Reimand Lab
tagline: Computational biology and cancer genomics
intro: >-
  We develop statistical and machine-learning methods to decode cancer genomes
  and multi-omics data, finding the mutations, pathways and biomarkers that
  shape how tumours grow and respond to therapy.
affiliations:
  - name: Ontario Institute for Cancer Research
    url: https://oicr.on.ca
  - name: Molecular Genetics, University of Toronto
    url: https://moleculargenetics.utoronto.ca
links:
