  scholar: https://scholar.google.com/citations?user=MFByBqwAAAAJ&hl=en&view_op=list_works&sortby=pubdate
  bluesky: https://bsky.app/profile/reimand.bsky.social
contact:
  email: juri.reimand@utoronto.ca
  address:
    - Ontario Institute for Cancer Research
    - MaRS Centre, 661 University Avenue, Suite 510
    - Toronto, ON M5G 0A3, Canada
  map: https://maps.google.com/?q=MaRS+Centre+West+Tower+661+University+Avenue+Toronto
join: >-
  We welcome graduate students, postdoctoral fellows and staff with skills and
  motivation for research in computational biology, genomics, statistics and
  machine learning. Graduate students join through the MSc and PhD programs of
  the Department of Molecular Genetics at the University of Toronto. To
  enquire, email Jüri with a CV and a short statement of interest.
programs:
  - name: Molecular Genetics graduate program
    url: https://moleculargenetics.utoronto.ca

